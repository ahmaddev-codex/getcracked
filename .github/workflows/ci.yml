name: CI

# One job per check, rather than four steps in one.
#
# They were sequential steps with `if: !cancelled()` so that a run reported
# every problem rather than only the first — which worked, but paid for it: the
# build waited on a test suite it does not depend on, and a red run showed a
# single "verify" cross that had to be opened to find out which of four things
# broke.
#
# As jobs they run in parallel, and each reports its own status. The cost is
# four checkouts and installs instead of one, which the pnpm cache makes cheap
# and which the parallelism more than repays — the test suite alone runs two
# WebAssembly runtimes.

on:
  push:
    # `dev` as well as `main`: work happens on dev, and a check that only runs
    # after a merge reports the problem to the person least able to act on it.
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getcracked
          POSTGRES_PASSWORD: getcracked
          POSTGRES_DB: getcracked
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://getcracked:getcracked@localhost:5432/getcracked
      BETTER_AUTH_SECRET: test-secret-for-ci-on-push-to-github-for-production-build
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  content:
    name: Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Its own job rather than only inside `prebuild`, so a broken reference
      # solution reports as "Content" rather than as a build failure — the two
      # are fixed by different people looking at different files.
      - run: pnpm content:check

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getcracked
          POSTGRES_PASSWORD: getcracked
          POSTGRES_DB: getcracked
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://getcracked:getcracked@localhost:5432/getcracked
      BETTER_AUTH_SECRET: test-secret-for-ci
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
